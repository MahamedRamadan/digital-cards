<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">البروفايل الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .profile-card { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08); overflow: hidden; text-align: center; padding: 40px 25px; position: relative; }
        .profile-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 110px; background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); z-index: 1; }
        .profile-img-container { width: 115px; height: 115px; margin: 30px auto 15px; border-radius: 50%; overflow: hidden; border: 4px solid #ffffff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12); position: relative; z-index: 2; background: #ffffff; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; position: relative; z-index: 2; }
        .profile-title { font-size: 15px; font-weight: 600; color: var(--primary-color); margin-bottom: 25px; position: relative; z-index: 2; background: #eef2ff; display: inline-block; padding: 4px 14px; border-radius: 20px; }
        .links-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 2; }
        .btn-link { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 20px; background: #f8fafc; color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 15px; border-radius: 14px; border: 1px solid var(--border-color); transition: all 0.3s; }
        .btn-link i { font-size: 18px; color: var(--text-sub); }
        .btn-link .content-side { display: flex; align-items: center; gap: 12px; }
        .btn-link:hover { background: var(--primary-color); color: #ffffff; border-color: var(--primary-color); transform: translateY(-3px); }
        .btn-link:hover i, .btn-link:hover span { color: #ffffff; }
        .btn-cv { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; border: none; justify-content: center; font-weight: 700; gap: 10px; }
        .btn-cv i { color: #ffffff; }
        .footer-note { margin-top: 30px; font-size: 12px; color: var(--text-sub); position: relative; z-index: 2; }
        .loading, .error-msg { padding: 40px; font-size: 16px; color: var(--text-sub); font-weight: 600; }
        .error-msg { color: #ef4444; }
    </style>
</head>
<body>

    <div class="profile-card" id="card-box">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البروفايل بأمان...</div>
    </div>

    <script>
        function decodeText(base64Str) {
            try {
                return decodeURIComponent(escape(window.atob(base64Str)));
            } catch (e) {
                return base64Str;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('id');
        const cardBox = document.getElementById('card-box');

        if (clientId) {
            fetch('clients.json')
                .then(response => response.json())
                .then(encryptedData => {
                    if (encryptedData[clientId]) {
                        const encClient = encryptedData[clientId];
                        
                        const client = {
                            name: decodeText(encClient.name),
                            title: decodeText(encClient.title),
                            image: decodeText(encClient.image),
                            cv: decodeText(encClient.cv),
                            phone: decodeText(encClient.phone),
                            whatsapp: decodeText(encClient.whatsapp),
                            email: decodeText(encClient.email),
                            github: decodeText(encClient.github)
                        };
                        
                        document.getElementById('page-title').innerText = client.name + " | البروفايل الرقمي";
                        
                        cardBox.innerHTML = `
                            <div class="profile-img-container">
                                <img src="${client.image}" alt="${client.name}">
                            </div>
                            <h1 class="profile-name">${client.name}</h1>
                            <p class="profile-title">${client.title}</p>
                            
                            <div class="links-list">
                                <a href="${client.cv}" class="btn-link btn-cv" target="_blank">
                                    <i class="fa-solid fa-file-pdf"></i>
                                    <span>تحميل السيرة الذاتية (CV)</span>
                                </a>
                                <a href="tel:${client.phone}" class="btn-link">
                                    <div class="content-side">
                                        <i class="fa-solid fa-phone"></i>
                                        <span>اتصال مباشر</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-left"></i>
                                </a>
                                <a href="https://wa.me/${client.whatsapp}" class="btn-link" target="_blank">
                                    <div class="content-side">
                                        <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
                                        <span>مراسلة واتساب</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-left"></i>
                                </a>
                                <a href="mailto:${client.email}" class="btn-link">
                                    <div class="content-side">
                                        <i class="fa-solid fa-envelope"></i>
                                        <span>البريد الإلكتروني</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-left"></i>
                                </a>
                                <a href="${client.github}" class="btn-link" target="_blank">
                                    <div class="content-side">
                                        <i class="fa-brands fa-github"></i>
                                        <span>حساب جيت هب (GitHub)</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-left"></i>
                                </a>
                            </div>
                            <div class="footer-note">صُنع بأعلى معايير الأمان والحماية الرقمية</div>
                        `;
                    } else {
                        cardBox.innerHTML = `<div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> عذراً، هذا البروفايل غير موجود.</div>`;
                    }
                })
                .catch(error => {
                    cardBox.innerHTML = `<div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> حدث خطأ في تحميل البيانات.</div>`;
                });
        } else {
            cardBox.innerHTML = `<div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> رابط غير صالح.</div>`;
        }
    </script>
</body>
</html>
